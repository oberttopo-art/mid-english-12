      sonTinh: "King Hung Vuong VI had a beautiful daughter. He did not want her to marry just any prince. So, he made an announcement that he was looking for the right husband for her. Many princes came from faraway lands, but none of them was a good match for the princess.\n\nSon Tinh was the Spirit of the Mountain, and Thuy Tinh was the Spirit of the Waters. One day, they both appeared as young noblemen and asked to marry the princess. They were equally talented, powerful, and respected. The King found it hard to choose, so he decided to give them a test. He said that the one who brought the proper wedding gifts first the next morning would marry his daughter.\n\nThe next day, Son Tinh arrived early with his gifts. The King kept his promise and gave the princess to him. Thuy Tinh was angry about losing. He challenged Son Tinh to fight for the princess. But Son Tinh refused, believing he had already won fairly. Furious, Thuy Tinh used his power to call the rivers and streams to rise. Soon, the land was covered with floods that destroyed crops and homes.\n\nSon Tinh stayed calm in his mountain palace. Whenever the water rose, he made his mountains higher. After many days of fighting, Thuy Tinh grew tired and ordered the waters to retreat. Still, he never accepted his defeat. Every year, he tried again to attack, and this is how monsoons came to Vietnam.",
      libraryInfo: "[Infographic: How to Study in the Library]\n1. Prepare Your Materials: Bring books, notes, stationery, water, library card.\n2. Choose Quiet Spot: Find table with good light, little noise. Avoid sitting too close to entrance or restroom.\n3. Set a Study Goal: Decide what you want to finish.\n4. Follow Library Rules: Speak softly, keep phone on silent, no eating inside.\n5. Take Short Breaks: Stand up, stretch, or walk for 5 minutes after 1 hour.\n6. Review Before Leaving: Check notes, organize books, return borrowed materials.",
      bali: "Exploring Bali's Natural Wonders\n\nBali, a beautiful island in Indonesia, is known for its stunning landscapes and rich culture. While many come for the beaches and temples, the island also offers natural attractions that amaze nature lovers from around the world. From national parks and waterfalls to terraced rice fields, Bali is full of natural beauty.\n\nIn the west lies West Bali National Park, a peaceful area filled with green forests, calm mangrove swamps, and colorful coral reefs along the sea. The air is fresh, and the scenery feels untouched. One of the park’s most special sights is the Bali Starling—a rare white bird with bright blue around its eyes. Its soft song adds magic to the quiet forest. Visitors can walk along clear paths and enjoy the rich variety of plants and animals in this protected area.\n\nHeading north, travelers find the scenic Munduk Waterfall, surrounded by green hills and forests. Water flows gently over rocky cliffs into a cool clear pool. Mist rises into the air, mixing with the calming sound of falling water. The walk to the waterfall passes through narrow paths lined with coffee and clove trees. Their fresh scent fills the air, offering a pleasant and peaceful experience. Munduk is the perfect place to relax and enjoy Bali’s natural charm.\n\nNear the cultural center Ubud, the famous Tegalalang rice terraces stretch across the hills in green steps. These terraces are shaped by generations of farmers who work the land by hand. In the morning, mist rises above the fields, and sunlight reflects off the water in the paddies. Farmers in wide-brimmed hats plant rice carefully, their feet sinking into the soft earth. Water flows gently through small canals, keeping the fields healthy and green. The quiet surroundings and slow rhythm of farm life create a peaceful and inspiring scene.\n\nThese natural wonders highlight Bali's dedication in preserving its environmental and cultural treasures. By exploring these sites, tourists not only experience the island's scenic beauty but also support ongoing conservation efforts, helping to ensure that Bali's wonders last for future generations.",
      internship: "My Experience as an Intern at a Sports Club\n\nLast summer, I had the opportunity to work as an intern at a local sports club. It was my first time working in a professional sports environment, and I was both nervous and excited. The internship went through a few phases, starting from orientation until finally jumping in to help during practices and games.\n\nOn my first day, I met the head coach, who welcomed me and explained my tasks. I had to set up cones for drills, bring water for the players, and check the training schedules. The first few days were challenging because I was not used to the morning routine. Every morning I had to wake up early, arrive on time, and follow instructions carefully. I worried about making mistakes, but the coaches were kind and guided me.\n\nIn the second month of my internship, I was trained to handle emergency situations. I got the chance to put that knowledge into practice when something unexpected happened. During football practice, a player fell and hurt his ankle. Everyone stopped, and I quickly ran to get the first aid kit. I helped the coach assess the injury and ensured the player stayed calm while we got him seated safely. Luckily, it wasn’t serious, but the experience reinforced an important lesson: staying alert and prepared during emergencies can make a big difference.\n\nAt the end of my internship, the coaches held an evaluation and reflection session where they shared the results of their feedback. They highlighted my strengths in teamwork, responsibility, and communication, and even gave me a club T-shirt as a gift. I felt proud because I had improved in these areas. It was a great experience, and I hope to work in a sports club again in the future.",
      socialMedia: "Social Media Harms Teen Mental Health\n\nIn today’s world, social media is a big part of many teenagers’ daily lives. While it has some benefits, such as staying connected with friends, meeting new people, and learning about interesting topics, it also brings serious problems. I strongly believe that social media harms teen mental health, and we must pay more attention to this issue before it becomes even worse.\n\nFirst, social media often makes teenagers compare themselves to others in an unhealthy way. When teens see pictures of people who seem perfect, they feel that they are not good enough. These feelings can lower self-esteem and lead to sadness, anxiety, or even depression. The problem is that many of these online posts are edited, filtered, or fake, but teens still feel pressure to look or live the same way. They may think that their own life is boring or not successful, which is simply not true.\n\nSecond, too much time on social media affects sleep and study habits. Many teenagers use their phones late at night, checking messages or watching videos, which reduces sleep time and quality. Without enough sleep, teens cannot focus well in class, and their grades may suffer. This can increase stress and worry about the future, making them feel overwhelmed.\n\nFinally, online bullying, or cyberbullying, is another serious danger. Unlike face-to-face bullying, it can happen at any time and be shared with many people. Victims of cyberbullying often feel alone, scared, and helpless, and in some cases, it leads to serious mental health problems.\n\nIn conclusion, although social media has some good uses, its harm to teen mental health is much greater. Teenagers need support from parents, teachers, and society to use it wisely. Schools should teach students how to use social media in healthy ways, and parents should guide their children to take breaks and spend time offline. By doing this, we can help protect young people’s mental health in this digital age.",
      lionMouse: "The Lion and the Mouse\n\nOnce upon a time, in a thick jungle in Africa, there lived a strong and fierce lion. Every afternoon, the lion would rest under the cool shade of a big tree after walking through the forest.\n\nOne day, while he was sleeping, a playful little mouse passed by. The mouse saw the lion’s thick mane and was curious. He climbed up and began to jump around on the lion’s head, playing in his mane.\n\nThe lion woke up suddenly and was not happy at all. He quickly caught the mouse in his big paw and roared, “Who dares to wake me up?” He was very angry and almost killed the mouse.\n\nScared and shaking, the mouse begged the lion, “Please don’t kill me! I didn’t mean to bother you. If you let me go, I promise I’ll help you one day.”\n\nThe lion laughed loudly. “You? Help me? That’s funny.” But the lion was feeling kind, so he let the mouse go free.\n\nA few days later, the lion was walking through the jungle again when he fell into a trap. A net set by hunters caught him, and he couldn’t escape. He tried to bite and tear the ropes, but they were too strong. The lion roared loudly, hoping someone would come.\n\nThe mouse heard the roar and ran to help. He saw the lion trapped and quickly started to chew the ropes with his sharp teeth. After some time, the net broke, and the lion was free.\n\nThe lion looked at the mouse with surprise and said, “Thank you! You really saved my life.”\n\nThe mouse smiled and said, “I told you I would help you one day.”\n\nFrom that moment on, the lion and the mouse became close friends. The lion learned that even small creatures can do great things, and we all need help sometimes.",
      studyTech: "[Infographic: Effective Study Techniques]\n1. Know Your Learning Style\n2. Set a Consistent Study Schedule\n3. Create a Comfortable Study Space\n4. Use the Pomodoro Technique (25 min study, 5 min break)\n5. Take Effective Notes\n6. Practice and Repeat\n7. Join a Study Group\n8. Leverage Technology\n9. Get Enough Sleep\n10. Be Patient and Persistent",
      reef: "The Great Barrier Reef\n\nThe Great Barrier Reef is one of the most beautiful places in the world. It is located in the Pacific Ocean, near the northeast coast of Australia. The reef is very big. It stretches over 2,000 kilometers and can even be seen from space. There are many small coral islands and clear, warm waters around the reef.\n\nThis reef is full of life. There are many kinds of colorful fish, sea turtles, dolphins, and even sharks. Coral of different shapes and colors grows under the water. Sea birds fly over the reef and nest on small islands. People can see this beauty by swimming, diving, or joining a boat tour.\n\nThe colors under the water are amazing. Coral comes in red, yellow, green, and blue. Some coral looks like trees, and some looks like big round stones. Small fish swim in and out of the coral like they are playing a game. In some places, soft coral moves with the water like grass in the wind. When the sun shines, the reef looks bright and full of light. It feels like a different world under the sea.\n\nThe reef is not only beautiful, but also very important. It helps protect the coast from big waves and storms. It is a home for sea animals and a place where plants can grow. Many people also get food and jobs from the sea near the reef. Without the reef, the ocean would not be the same.",
      money: "Why Teenagers Should Learn to Manage Their Money\n\nMany young people today often spend money on things they like, such as snacks, clothes, or fun activities. But learning to handle money from a young age is very important. Good money habits can help students make a better future.\n\nHaving a clear plan for the future can show teenagers how to use their money. Students should think about short-term goals, like getting a new phone, and long-term goals, like saving for college or starting a business. Writing these goals down can help students stay motivated and focused.\n\nA budget helps students see where their money goes every month. It's important to list basic needs like food and travel, and also other costs like clothes or presents. A budget makes it easier to decide how much money to save, spend, or keep for unexpected problems.\n\nSometimes, students don't know how much they spend on small things. Keeping track of spending with notes or apps can help students understand their habits. This helps them stay within their budget and make changes if needed.\n\nTeenagers should also learn the difference between saving money and investing money. Saving is safer but slower, while investing has more risk but can earn more money. Knowing both can help students choose the best way for their money goals.\n\nTo sum up, students who learn to plan, budget, track, and understand saving choices are more ready for the future. That is why learning about money should start early and be done often.\n\nTable 1. How do students manage their money?\n- Students who save regularly: 45% (Save at least 10% of allowance)\n- Students who track expenses: 35% (Use apps or notes)\n- Students with financial education: 25% (Have learned budgeting in class)\n- Students who often borrow from friends: 30% (Due to running out of money)\n- Students who spend most on food & drinks: 50% (Largest category of spending)\n- Students who plan monthly budgets: 28% (Usually better savers)",
      falseLion: "The False Lion King\n\nOnce upon a time, in Africa, there lived two lion kings. One was named Hera and the other was Shero. Hera was very strong and handsome. All the animals loved and respected him. He was a great leader. Shero was not like Hera. He had a small mane and a funny, squeaky voice. Shero liked to pretend he was as powerful as Hera. He often copied Hera’s roar, but it made the other animals laugh.\n\nOne day, the animals heard that some hyenas were causing trouble near the river. Hera quickly gathered his followers to stop the hyenas. Shero also wanted to come. He wanted to show everyone that he was strong too.\n\nWhen they reached the river, Hera roared loudly. His roar was so powerful that the hyenas got scared. Shero also tried to roar, but his voice was high and silly. The hyenas laughed at him. Their leader, Hank the Hyena, made jokes about Shero.\n\nHera stayed calm and smiled. Shero did not give up. He said, “I am just as strong as Hera!” The hyenas laughed even louder. Shero tried to show his power by jumping on a small dirt hill. But he tripped and fell into the ground. The hyenas laughed so much they cried. Even Hera laughed a little.\n\nAt the end of the day, the hyenas left, still laughing about Shero. Hera told Shero, “You are not like me, but you make everyone happy with your jokes.” Shero smiled and understood that he had his own special gift.\n\nFrom that day, Shero became the kingdom’s jester. He and Hera ruled together — one with strength, and one with laughter. The animals learned that both power and fun are important in life."

    const keys = {};
    questionsData.forEach(q => { keys[q.id] = q.correct; });

    function startExam() {
      studentNama = document.getElementById('input-nama').value.trim();
      studentKelas = document.getElementById('input-kelas').value.trim();
      if(!studentNama || !studentKelas) return alert("Mohon isi Nama Lengkap dan Kelas terlebih dahulu!");

      document.getElementById('disp-nama').innerText = studentNama;
      document.getElementById('disp-kelas').innerText = "Kelas: " + studentKelas;
      document.getElementById('modal-start').style.display = 'none';

      enterFullscreen();
      initNav();
      loadQuestion(0);
      startTimer();
      setupSecurity();
    }

    function enterFullscreen() {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    function reLock() {
      document.getElementById('modal-lock').style.display = 'none';
      enterFullscreen();
    }

    function setupSecurity() {
      document.addEventListener('fullscreenchange', handleViolation);
      document.addEventListener('visibilitychange', () => { if (document.hidden) handleViolation(); });
      window.addEventListener('blur', handleViolation);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || e.altKey || (e.ctrlKey && (e.key === 't' || e.key === 'n' || e.key === 'w' || e.key === 'i' || e.key === 'u' || e.key === 'c' || e.key === 'v'))) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    }

    function handleViolation() {
      if (document.getElementById('modal-start').style.display !== 'none') return;
      violationCount++;
      if (violationCount >= maxViolations) {
        alert("Anda terdeteksi keluar dari layar ujian lebih dari batas toleransi. Ujian dikumpulkan otomatis!");
        finishExam(true);
      } else {
        document.getElementById('warn-count').innerText = maxViolations - violationCount;
        document.getElementById('modal-lock').style.display = 'flex';
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        totalSeconds--;
        let m = Math.floor(totalSeconds / 60);
        let s = totalSeconds % 60;
        document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0':''}${s}`;
        if (totalSeconds <= 0) { clearInterval(timerInterval); finishExam(true); }
      }, 1000);
    }

    function initNav() {
      let grid = document.getElementById('grid-nav');
      grid.innerHTML = '';
      for (let i = 1; i <= 44; i++) {
        let b = document.createElement('button');
        b.className = 'btn-num';
        b.innerText = i;
        b.id = 'nav-' + i;
        b.onclick = () => loadQuestion(i - 1);
        grid.appendChild(b);
      }
    }

    function loadQuestion(idx) {
      currentQ = idx;
      let qData = questionsData[idx] || questionsData[0];
      let qNum = idx + 1;

      document.getElementById('q-title').innerText = "Soal No. " + qNum;
      document.getElementById('q-passage').innerHTML = qData.passage ? `<div class="text-passage">${qData.passage}</div>` : '';
      document.getElementById('q-text').innerText = qData.question;

      let oBox = document.getElementById('q-options');
      oBox.innerHTML = '';

      let isMulti = Array.isArray(keys[qNum]);
      let inputType = isMulti ? 'checkbox' : 'radio';

      qData.options.forEach((optText, optIdx) => {
        let isChecked = false;
        if (isMulti) {
          isChecked = userAnswers[qNum] && userAnswers[qNum].includes(optIdx);
        } else {
          isChecked = userAnswers[qNum] === optIdx;
        }

        let item = document.createElement('div');
        item.className = 'option-item';
        item.onclick = () => toggleAnswer(qNum, optIdx, isMulti);
        item.innerHTML = `<input type="${inputType}" name="opt_${qNum}" ${isChecked ? 'checked' : ''}> <span>${optText}</span>`;
        oBox.appendChild(item);
      });

      document.querySelectorAll('.btn-num').forEach(b => b.classList.remove('active'));
      document.getElementById('nav-' + qNum).classList.add('active');
    }

    function toggleAnswer(qNum, optIdx, isMulti) {
      if (isMulti) {
        if (!userAnswers[qNum]) userAnswers[qNum] = [];
        let pos = userAnswers[qNum].indexOf(optIdx);
        if (pos > -1) userAnswers[qNum].splice(pos, 1);
        else userAnswers[qNum].push(optIdx);
      } else {
        userAnswers[qNum] = optIdx;
      }
      
      document.getElementById('nav-' + qNum).classList.add('done');
      loadQuestion(currentQ);
    }

    function nextQuestion() { if(currentQ < 43) loadQuestion(currentQ + 1); }
    function prevQuestion() { if(currentQ > 0) loadQuestion(currentQ - 1); }

    function calculateScore() {
      let correctCount = 0;
      for(let i = 1; i <= 44; i++) {
        let userAns = userAnswers[i];
        let keyAns = keys[i];

        if (Array.isArray(keyAns)) {
          if (Array.isArray(userAns) && JSON.stringify(userAns.sort()) === JSON.stringify(keyAns.sort())) {
            correctCount++;
          }
        } else {
          if (userAns === keyAns) correctCount++;
        }
      }
      return Math.round((correctCount / 44) * 100);
    }

    function finishExam(force = false) {
      if(!force && !confirm("Apakah Anda yakin ingin menyelesaikan ujian?")) return;
      clearInterval(timerInterval);
      let finalScore = calculateScore();

      // Memasukkan data ke form tersembunyi
      document.getElementById('g_nama').value = studentNama;
      document.getElementById('g_kelas').value = studentKelas;
      document.getElementById('g_nilai').value = finalScore;

      // Melakukan submit form secara otomatis
      document.getElementById('gform').submit();

      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      
      document.body.innerHTML = `
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; background:#1e293b; color:#fff; text-align:center; padding:20px;">
          <h2 style="color:#22c55e; font-size:32px; margin-bottom:10px;">Ujian Selesai!</h2>
          <p style="font-size:22px; margin:15px 0;">Nilai Akhir: <b style="color:#38bdf8;">${finalScore} / 100</b></p>
          <p style="color:#94a3b8; font-size:14px;">Data jawaban dan skor Anda telah tersimpan secara otomatis ke Google Form / Sheets.</p>
        </div>
      `;
    }
  </script>
